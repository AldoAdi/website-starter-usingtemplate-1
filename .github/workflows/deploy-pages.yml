name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to publish and id-token:write for the
# deploy action's OIDC exchange. contents:read is all the checkout needs --
# the library is a public repo, so nothing here requires a PAT.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway; queued
# runs collapse to the newest, since only the latest commit matters.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Actions are pinned to commit SHAs, not tags: a tag can be moved to
    # malicious code, and this workflow holds pages:write and id-token:write.
    # Bump by resolving the new tag with `git ls-remote` and updating both.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing later pushes, so do not leave the token in .git/config
          # for every subsequent step (and every dependency) to read.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12'
          cache: npm

      # npm canonicalizes GitHub dependencies to git+ssh in the lockfile
      # no matter which URL form package.json uses, and a hosted runner has
      # no SSH key for github.com. Rewriting ssh -> https lets the library
      # be fetched anonymously, which works because it is a public repo.
      - name: Fetch GitHub dependencies over HTTPS, not SSH
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      # `npm ci` installs from the committed lockfile, so the library
      # resolves to the exact pinned commit rather than whatever main
      # happens to be. Lifecycle scripts are blocked by the committed .npmrc
      # (ignore-scripts=true); --ignore-scripts repeats it here so deleting
      # that file cannot silently turn them back on in the deploy.
      - run: npm ci --ignore-scripts

      # Fail the deploy on a known high/critical advisory in what ships, and
      # on a registry package whose signature does not verify. The library is
      # a git dependency, so it has no registry signature -- its pin is the
      # commit SHA in package-lock.json.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit signatures

      - run: npm run build
        env:
          DEPLOY_TARGET: github-pages
          # A repository *variable*, not a secret. The Web3Forms access key
          # identifies the destination inbox and is baked into the deployed
          # HTML for anyone to read -- that is how the service works. Spam
          # control is the honeypot plus Web3Forms' own filtering. Storing it
          # as a secret would imply a secrecy it does not have.
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_KEY }}
          # Set one or the other, never both -- see .env.example.
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          # The scheduler /book hands off to. Unset means the placeholder in
          # bookingConfig.ts ships, so set this before pointing any ad at
          # /book.
          NEXT_PUBLIC_BOOKING_URL: ${{ vars.NEXT_PUBLIC_BOOKING_URL }}
          # robots.txt defaults to disallowing everything when this is
          # unset -- the safe default, so a preview build cannot quietly get
          # indexed. This is the real production deploy, so opt in to being
          # crawled. Without this line the live robots.txt blocks everyone.
          NEXT_PUBLIC_SITE_ENV: production

      # Pages serves through Jekyll unless told otherwise, and Jekyll skips
      # any path starting with an underscore -- which is the whole of
      # _next/. Without this file the site deploys and every stylesheet and
      # script 404s.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
